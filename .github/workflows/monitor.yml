name: DNT Cabin Monitor

on:
  schedule:
    # Hvert 30. minutt. GitHub kan forsinke planlagte kjøringer noe.
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send kun en test-e-post (hopp over sjekk)'
        type: boolean
        default: false

permissions:
  contents: write  # for å committe state.json

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check availability and send notifications
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python monitor.py

      - name: Commit updated state
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json
          if git diff --quiet --staged; then
            echo "Ingen endring i state.json."
          else
            git commit -m "Update availability state [skip ci]"
            git pull --rebase
            git push
          fi
